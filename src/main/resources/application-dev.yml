server:
  port: 8081

# Services
external-services:
  social:
    url: http://localhost:8080

# Postgres
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pump_auth
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

# Logging
logging:
  level:
    com.johnmartin.auth: TRACE